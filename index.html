<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Translation Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">🌐</div>
      <h1>Language Translator</h1>
    </header>

    <section class="translator">
      <!-- ইনপুট প্যানেল -->
      <div class="panel">
        <div class="panel-top">
          <select id="sourceLang"></select>
        </div>
        <textarea id="inputText" placeholder="এখানে টেক্সট লিখুন..." maxlength="500"></textarea>
        <div class="panel-bottom">
          <span class="counter"><span id="charCount">0</span> / 500</span>
        </div>
      </div>

      <button id="swapBtn" title="ভাষা অদলবদল">⇄</button>

      <!-- আউটপুট প্যানেল -->
      <div class="panel output-panel">
        <div class="panel-top">
          <select id="targetLang"></select>
        </div>
        <div id="outputText" class="output">অনুবাদ এখানে দেখাবে...</div>
        <div class="panel-bottom">
          <button id="copyBtn" class="icon-btn">📋 Copy</button>
          <button id="speakBtn" class="icon-btn">🔊 Speak</button>
        </div>
      </div>
    </section>

    <button id="translateBtn">Translate ➜</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
